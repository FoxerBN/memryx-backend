# ==== App ====
spring.application.name=flashcard

# ==== DataSource ? Supabase (PostgreSQL) ====
spring.datasource.url=jdbc:postgresql://aws-0-eu-central-1.pooler.supabase.com:6543/postgres?prepareThreshold=0
spring.datasource.username=postgres.usukzddebpttendzfilx
spring.datasource.password=sharingan
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari pool (rozumné defaulty)
spring.datasource.hikari.maximumPoolSize=10
spring.datasource.hikari.minimumIdle=2
spring.datasource.hikari.idleTimeout=600000
spring.datasource.hikari.connectionTimeout=30000

# ==== JPA / Hibernate ====
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Po presune mapovania do service vrstvy mô?e? da? false:
spring.jpa.open-in-view=true

# ==== Flyway migrácie ====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==== H2 explicitne vypnuté ====
spring.h2.console.enabled=false

# ==== Security / JWT / Cookies ====
app.jwt.secret=21966fda-4a7a-4f96-ac5c-5458b70bbc39
app.admin.username=Demo123
# Pre nasadenie za HTTPS odporú?am ponecha? true (SameSite=None; Secure):
app.cookies.secure=true

# Reverzný proxy / X-Forwarded-* hlavi?ky (napr. Vercel/NGINX)
server.forward-headers-strategy=framework

# ==== Logging ====
# TRACE je v produkcii hlu?né; zní?il som, ale nechávam tvoj balí?ek na DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.sk.foxer.flashcard=DEBUG
